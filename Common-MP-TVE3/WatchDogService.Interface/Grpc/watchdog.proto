// MediaPortal TV Server watchdog service (replaces the former .NET Remoting endpoint on port 9997).
// Transport: gRPC over TLS, every call must carry "authorization: Bearer <api key>" (same key as TvControl).

syntax = "proto3";

package mediaportal.watchdog.v1;

option csharp_namespace = "WatchDogService.Interface.Proto";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

message LogChunk {
  bytes data = 1;
}

service WatchDog {
  rpc StartTvService (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc StopTvService (google.protobuf.Empty) returns (google.protobuf.StringValue);
  // Zip archive with the TV server logs and the Application/System event logs, streamed in chunks.
  rpc ReadLog (google.protobuf.Empty) returns (stream LogChunk);
  rpc ClearTvServerLogs (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc ClearWindowsEventLogs (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc Reboot (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Shutdown (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc PowerOff (google.protobuf.Empty) returns (google.protobuf.Empty);
}
